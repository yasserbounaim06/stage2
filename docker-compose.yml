version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yolo-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    environment:
      - VAST_API_KEY=${VAST_API_KEY}
      - SALAD_API_KEY=${SALAD_API_KEY}
      - SALAD_ORG_NAME=${SALAD_ORG_NAME}
      - SALAD_PROJECT_NAME=${SALAD_PROJECT_NAME}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yolo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
